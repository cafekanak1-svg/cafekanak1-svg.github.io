<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KANAK INTERNET CAFE QR</title>
<style>body{font-family:Arial,sans-serif;text-align:center;padding:20px;color:#09245a}#qrcode{margin:20px auto;width:260px;height:260px}button{padding:12px 18px;background:#0755a5;color:#fff;border:0;border-radius:8px;font-size:16px;cursor:pointer}</style></head>
<body><h2>KANAK INTERNET CAFE</h2><p>Scan to open the Shop Information Page</p><div id="qrcode"></div><p id="target" style="overflow-wrap:anywhere"></p><button onclick="window.print()">PRINT QR CODE</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const target = new URL("index.html", window.location.href).href;
document.getElementById("target").textContent = target;
new QRCode(document.getElementById("qrcode"), {text: target, width: 260, height: 260, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H});
</script></body></html>
